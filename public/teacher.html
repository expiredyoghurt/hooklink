<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hook &amp; Link: teacher dashboard</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;--bg:#fff8ec;--card:#fff;--ink:#2b2a33;--mut:#6b6a75;--pri:#ff7a45;--ln:#f0dfc4;--bb:#d64545;--gb:#2e9e4f;--mk:#fff3d1}
@media (prefers-color-scheme:dark){:root{--bg:#1e1c24;--card:#2a2833;--ink:#f3f1f7;--mut:#b4b1c0;--ln:#403d4d;--mk:#463a14}}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,sans-serif}main{max-width:72rem;margin:0 auto;padding:1rem;padding-top:calc(1rem + env(safe-area-inset-top,0px))}
.card{background:var(--card);border:2px solid var(--ln);border-radius:1rem;padding:1rem;margin:.8rem 0;overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--ln);padding:.35rem .5rem;text-align:left;vertical-align:top}th{font-size:.85rem}td.n{white-space:nowrap}
input,select,button,textarea{font:inherit;color:inherit;padding:.45rem .7rem;border:2px solid var(--ln);border-radius:.6rem;background:var(--card);margin:.15rem 0}textarea{width:100%}input.w{width:100%}button{cursor:pointer}button.pri{background:var(--pri);border-color:var(--pri);color:#2b1a10;font-weight:700}button.sm{padding:.2rem .5rem;font-size:.9rem}button.dg{border-color:var(--bb);color:var(--bb)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}.tabs button[aria-selected=true]{background:var(--pri);border-color:var(--pri);color:#2b1a10;font-weight:700}
.err{color:var(--bb)}.ok{color:var(--gb);font-weight:700}.mut{color:var(--mut)}mark{background:var(--mk);color:inherit;border-radius:.3rem;padding:0 .2rem}.tag{font-size:.8rem;border:1px solid var(--ln);border-radius:1rem;padding:0 .5rem}
.sr{position:absolute;left:-9999px}.g3{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr))}label{font-weight:600;font-size:.9rem;display:block;margin-top:.3rem}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}h1:focus,h2:focus{outline:3px solid var(--pri)}
</style></head><body><main id="m"></main><script>
const $=id=>document.getElementById(id),M=$('m'),RK={1:'🌟 Ideal',2:'👍 Good',3:'🙂 Workable'},NM={ha:'Hook A',hb:'Hook B',hc:'Hook C',la:'Link A',lb:'Link B',lc:'Link C',x1:'Decoy 1',x2:'Decoy 2'};
let PD=null,T=null,ROLE='',WHO='',D=null,SL=null,TL=null,F='',TAB='results',E=null,msg='';
try{T=sessionStorage.getItem('tt');ROLE=sessionStorage.getItem('tr')||'';WHO=sessionStorage.getItem('tw')||''}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(r.status===401&&T){out('Please log in again.');throw new Error('login')}if(!r.ok){const e=new Error(d.error||'Error');e.errors=d.errors;throw e}return d}
const foc=()=>{const h=M.querySelector('h1');if(h){h.tabIndex=-1;h.focus()}};
function out(m){T=null;try{sessionStorage.clear()}catch(e){}login(m)}
function login(m){M.innerHTML=`<h1>Hook &amp; Link: teacher dashboard</h1><div class="card"><label for="u">Username</label><input id="u" autocomplete="username"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><p class="err" id="e" role="alert">${esc(m||'')}</p><button class="pri" id="go">Log in</button></div>`;foc();
 const go=async()=>{try{const d=await api('login',{user:$('u').value,password:$('p').value});T=d.token;ROLE=d.role;WHO=d.name;try{sessionStorage.setItem('tt',T);sessionStorage.setItem('tr',ROLE);sessionStorage.setItem('tw',WHO||'')}catch(e){}start()}catch(e){$('e').textContent=e.message}};$('go').onclick=go;$('p').onkeydown=e=>{if(e.key==='Enter')go()}}
async function start(){try{D=await api('hl-results');SL=(await api('hl-stories')).stories;PD=await api('plan-defaults');TL=ROLE==='admin'?(await api('teachers')).teachers:null}catch(e){if(e.message!=='login')login(e.message);return}draw()}
function shell(body){M.innerHTML=`<h1>🪝 Hook &amp; Link: ${ROLE==='admin'?'admin':'teacher'} dashboard</h1><nav class="tabs" aria-label="Sections">${[['results','Results'],['pupils','Pupils'],['stories','Stories'],['plan','Planning'],...(ROLE==='admin'?[['teachers','Teachers']]:[]),['password','Password']].map(([k,v])=>`<button role="tab" aria-selected="${TAB===k}" data-tab="${k}">${v}</button>`).join('')}<button id="lo">Log out</button></nav><p class="${msg.startsWith('!')?'err':'ok'}" role="status">${esc(msg.replace(/^!/,''))}</p>${body}`;msg='';foc();
 M.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;E=null;draw()});$('lo').onclick=()=>out()}
const done=async(f,ok)=>{try{await f();msg=ok||'Saved.'}catch(e){if(e.message==='login')return;msg='!'+e.message}await start()};
const classes=()=>[...new Set(D.pupils.map(p=>(p.class||'').trim().toUpperCase()))].filter(Boolean).sort();
const inF=p=>!F||(p.class||'').trim().toUpperCase()===F;
const sel=()=>`<label for="cf">Class</label><select id="cf"><option value="">All my classes</option>${classes().map(c=>`<option ${c===F?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
function draw(){({results:rRes,pupils:rPup,stories:rSto,plan:rPlan,teachers:rTea,password:rPw})[TAB]()}
/* ---------- results ---------- */
const S=n=>n?'⭐'.repeat(n)+`<span class="mut"> ${n}/3</span>`:'<span class="mut">–</span>';
function rRes(){const ps=D.pupils.filter(inF),ttl=id=>esc((D.stories.find(s=>s.id===id)||{title:'(removed story)'}).title);
 const avg=(m,id)=>{const v=ps.map(p=>p[m][id]).filter(Boolean);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1)+` (${v.length})`:'–'};
 const tbl=m=>`<div class="card"><h2>${m==='hook'?'Spot the Hook':'Make the Link'}: stars per story</h2><table><tr><th>Pupil</th><th>Class</th>${D.stories.map(s=>`<th>${esc(s.title)}</th>`).join('')}</tr>${ps.map(p=>`<tr><td>${esc(p.username)}</td><td>${esc(p.class)}</td>${D.stories.map(s=>`<td class="n">${S(p[m][s.id])}</td>`).join('')}</tr>`).join('')||'<tr><td>No pupils yet.</td></tr>'}<tr><th colspan="2">Class average (pupils)</th>${D.stories.map(s=>`<th>${avg(m,s.id)}</th>`).join('')}</tr></table></div>`;
 const mxr=`<div class="card"><h2>Mixed Round</h2><p class="mut">Best stars, and cards right out of cards seen (all rounds).</p><table><tr><th>Pupil</th><th>Class</th><th>Best</th><th>Ideal-hook cards</th><th>Link-kind cards</th></tr>${ps.map(p=>`<tr><td>${esc(p.username)}</td><td>${esc(p.class)}</td><td class="n">${S(p.mix)}</td><td>${esc(p.mr)||'–'}</td><td>${esc(p.mk)||'–'}</td></tr>`).join('')||'<tr><td>No pupils yet.</td></tr>'}</table></div>`;
 const grp={};ps.forEach(p=>p.h.forEach(h=>(grp[h]=grp[h]||[]).push(p.username)));
 const nx=Object.keys(D.hints).filter(h=>grp[h]).map(h=>`<tr><td><b>${esc(D.hints[h][0])}</b></td><td>${grp[h].map(esc).join(', ')}</td><td>${esc(D.hints[h][1])}</td></tr>`).join('');
 const agg=rows=>{const o={};rows.filter(r=>!F||r.cls===F).forEach(r=>{const k=[r.mode,r.story,r.text,r.r].join('|');o[k]=o[k]||{...r,n:0,pupils:0};o[k].n+=r.n;o[k].pupils+=r.pupils});return Object.values(o).sort((a,b)=>b.n-a.n).slice(0,15)};
 const mk=agg(D.mistakes).map(x=>`<tr><td>${x.mode==='hook'?'Spot the Hook':'Make the Link'}</td><td>${ttl(x.story)}</td><td>"${esc(x.text)}"</td><td>${x.r==='link'?'a link tapped as a hook':'not a '+x.mode}</td><td>${x.n} taps, ${x.pupils} pupils</td></tr>`).join('');
 const kd=agg(D.kinds).map(x=>`<tr><td>${ttl(x.story)}</td><td>"${esc(x.text)}"</td><td>${x.n} times, ${x.pupils} pupils</td></tr>`).join('');
 shell(`<div class="card">${sel()} <button id="csv">Download CSV</button></div><div class="card"><h2>Suggested next steps</h2><p class="mut">Based on each pupil's attempts. Use it to group pupils for reteaching.</p><table><tr><th>Pattern</th><th>Pupils</th><th>Try this</th></tr>${nx||'<tr><td colspan="3">No patterns yet.</td></tr>'}</table></div>${tbl('hook')}${tbl('link')}${mxr}<div class="card"><h2>Details pupils tap most by mistake</h2><table><tr><th>Game</th><th>Story</th><th>Detail</th><th>Mistake</th><th>How often</th></tr>${mk||'<tr><td>None recorded yet.</td></tr>'}</table></div><div class="card"><h2>Right detail, wrong kind of link</h2><table><tr><th>Story</th><th>Detail</th><th>How often</th></tr>${kd||'<tr><td>None recorded yet.</td></tr>'}</table></div>`);
 $('cf').onchange=e=>{F=e.target.value;draw()};
 $('csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['pupil','class','mode',...D.stories.map(s=>s.title)]];ps.forEach(p=>['hook','link'].forEach(m=>rows.push([p.username,p.class,m,...D.stories.map(s=>p[m][s.id]||'')])));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='hook-and-link-results.csv';a.click()}}
/* ---------- pupils ---------- */
function rPup(){const ps=D.pupils.filter(inF),tot=p=>Object.values(p.hook).concat(Object.values(p.link)).reduce((a,b)=>a+b,0);
 shell(`<div class="card">${sel()}<table><tr><th>Pupil</th><th>Class</th><th>Stars</th><th>Last played</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.username)}</td><td>${esc(p.class)}</td><td>${tot(p)}</td><td>${esc(p.last||'never')}</td><td class="n"><button class="sm" data-pin="${esc(p.username)}">Reset PIN</button> <button class="sm dg" data-del="${esc(p.username)}">Delete</button></td></tr>`).join('')||'<tr><td>No pupils in your classes yet.</td></tr>'}</table></div>`);
 $('cf').onchange=e=>{F=e.target.value;draw()};
 M.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const u=b.dataset.pin,p=prompt('New PIN for '+u+' (4 to 8 digits)');if(p)done(()=>api('reset-pin',{username:u,pin:p}),'PIN changed for '+u)});
 M.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const u=b.dataset.del;if(confirm('Delete '+u+' and all their results? This cannot be undone.'))done(()=>api('delete-pupil',{username:u}),u+' deleted')})}
/* ---------- stories ---------- */
function rSto(){if(E)return editor();
 shell(`<div class="card"><p>${ROLE==='admin'?'You can edit every story.':'You can edit stories you create. Use Copy to start from any story.'} Hidden stories disappear from pupils' lists but keep their results.</p><button class="pri" id="new">+ New story</button><table><tr><th>#</th><th>Story</th><th>Source</th><th>Status</th><th></th></tr>${SL.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.title)}</td><td><span class="tag">${s.source==='custom'?'By '+esc(s.author_name||'teacher'):s.source==='edited'?'Built-in (edited)':'Built-in'}</span></td><td>${s.active?'Visible':'<b>Hidden</b>'}</td><td class="n"><button class="sm" data-cp="${s.id}">Copy</button> ${s.canEdit?`<button class="sm" data-ed="${s.id}">Edit</button> <button class="sm" data-hd="${s.id}">${s.active?'Hide':'Show'}</button> ${s.source==='builtin'?'':`<button class="sm dg" data-rm="${s.id}">${s.source==='edited'?'Restore original':'Delete'}</button>`}`:''}</td></tr>`).join('')}</table></div>`);
 const get=id=>SL.find(s=>s.id===id);
 $('new').onclick=()=>{E={id:'',title:'',text:'',areas:{},decoys:{},whole:{}};draw()};
 M.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const s=get(b.dataset.cp);E={id:'',title:s.title+' (copy)',text:s.text,areas:Object.fromEntries(s.areas.map(a=>[a.area,a])),decoys:{...s.decoys},whole:{...(s.whole||{})}};draw()});
 M.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const s=get(b.dataset.ed);E={id:s.id,title:s.title,text:s.text,areas:Object.fromEntries(s.areas.map(a=>[a.area,a])),decoys:{...s.decoys},whole:{...(s.whole||{})}};draw()});
 M.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{const s=get(b.dataset.hd);done(()=>api('hl-story-active',{id:s.id,active:!s.active}),s.active?'Story hidden':'Story visible')});
 M.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const s=get(b.dataset.rm);if(confirm(s.source==='edited'?'Restore the original built-in version?':'Delete "'+s.title+'" and its results? This cannot be undone.'))done(()=>api('hl-story-delete',{id:s.id}),'Done')})}
const AREA=l=>{const a=E.areas[l]||{};const U=l.toUpperCase();return `<div class="card" data-area="${l}"><h3>Area ${U}</h3><p class="mut" id="ph${l}"></p><label for="rk${l}">Rank</label><select id="rk${l}"><option value="">Choose…</option>${[1,2,3].map(r=>`<option value="${r}" ${+a.rank===r?'selected':''}>${RK[r]}</option>`).join('')}</select><label for="kd${l}">Kind of link</label><select id="kd${l}"><option value="">Choose…</option>${['object','action','feeling','words'].map(k=>`<option ${a.kind===k?'selected':''}>${k}</option>`).join('')}</select><label for="li${l}">One-line memory (shown in Spot the Hook). Say what happened, not what triggers it. Start with the name: "Aisha remembers..."</label><input class="w" id="li${l}" maxlength="140" value="${esc(a.line)}"><label for="me${l}">Memory (shown in Make the Link)</label><textarea id="me${l}" rows="3">${esc(a.memory)}</textarea><label for="wh${l}">Why Hook ${U} is a hook</label><input class="w" id="wh${l}" value="${esc(a.wh)}"><label for="wr${l}">Why it has this rank</label><input class="w" id="wr${l}" value="${esc(a.wr)}"><label for="wl${l}">Why Link ${U} is a link</label><input class="w" id="wl${l}" value="${esc(a.wl)}"></div>`};
function editor(){shell(`<details class="card" ${E.id?'':'open'}><summary><b>How to write a good story</b> (read this first)</summary><ol><li><b>Start with the choice.</b> Write 100 to 150 words with one problem the character must act on, and an ending that shows what they chose. Use short P3/4 sentences.</li><li><b>Plan three different memories</b> that all connect to that same problem or lesson. Each memory is one or two sentences. Also write a <b>one-line memory</b> for each, such as "Aisha remembers being too scared to jump into the pool." Pupils read these lines in Spot the Hook and pick the ONE hook that opens the best memory, so say what happened but not which object triggers it.</li><li><b>Put the three hooks before the problem peaks.</b> Strong hooks are a personal object or a sense (smell, sound, taste, touch), written as the character's own: "her blue swimming goggles", not "goggles". A place is the weakest hook.</li><li><b>Put the three links after, in the resolution.</b> Use a different kind for each area (same object, action, feeling or words). Mark a whole short phrase, such as a full action, not one word.</li><li><b>Rank them honestly.</b> Ideal: an object or sense at the exact moment of choice, and its memory changes what the character does. Good: a real hook, but weaker timing or a less central memory. Workable: a broad hook, or a link that is only a feeling. Write the reasons for pupils to read.</li><li><b>Add two decoys.</b> Ordinary details that tempt but connect to no memory (a passing bus, a ticking clock). Never leave an unmarked detail that could be a hook, or pupils will be marked wrong for a fair answer.</li><li><b>Tell the Ideal area as one finished story.</b> Fill in the model flashback story: the present story, the hook, the flashback, and a link back that shows how the memory changed the character.</li><li><b>Check it aloud.</b> At each hook: could the character pause and remember? At each link: does the memory clearly tie back?</li></ol></details><div class="card"><h2>${E.id?'Edit story':'New story'}</h2><p><b>1.</b> Write the whole story. <b>2.</b> Select words, then press a marker button to mark them. Press a marker with nothing selected to remove it. <b>3.</b> Fill in the three areas and two decoys.</p><p class="mut">Ranks: 🌟 Ideal = a personal object or sense, noticed just when the character must choose, with a link that carries the lesson. 👍 Good = a real hook, but weaker timing or a less central memory. 🙂 Workable = a broad hook such as a place, or a link that is only a feeling. Each hook must come before its link. If you change the wording of a story pupils have played, old mistake counts may point to different words.</p>
 <label for="ti">Title</label><input class="w" id="ti" value="${esc(E.title)}" maxlength="40"><label for="tx">Story (blank line = new paragraph)</label><textarea id="tx" rows="10">${esc(E.text)}</textarea>
 <div role="group" aria-label="Markers" class="tabs">${Object.entries(NM).map(([k,v])=>`<button class="sm" data-mk="${k}">${v}</button>`).join('')}</div><h3>Preview</h3><div class="card" id="pv" aria-live="polite"></div></div>
 <div class="g3">${['a','b','c'].map(AREA).join('')}</div><div class="card"><h3>Decoys (details that are NOT hooks)</h3><label for="d1">Why Decoy 1 is not a hook</label><input class="w" id="d1" value="${esc(E.decoys.x1)}"><label for="d2">Why Decoy 2 is not a hook</label><input class="w" id="d2" value="${esc(E.decoys.x2)}"></div>
 <div class="card"><h3>Model flashback story (for the Ideal area)</h3><p class="mut">Optional, but recommended. Pupils read it after Spot the Hook, so they see a story with all four parts. Fill in all four boxes or leave all four empty. Include the Ideal hook and link words exactly as marked above, and they will be highlighted for pupils.</p><label for="wp">1. The present story (before the hook)</label><textarea id="wp" rows="3">${esc((E.whole||{}).present)}</textarea><label for="wk">2. The hook (the sentence with the Ideal hook)</label><textarea id="wk" rows="2">${esc((E.whole||{}).hook)}</textarea><label for="wf">3. The flashback (the memory told as a short story)</label><textarea id="wf" rows="4">${esc((E.whole||{}).flashback)}</textarea><label for="wb">4. The link back (back in the present; show how the memory changed what the character does or feels)</label><textarea id="wb" rows="4">${esc((E.whole||{}).back)}</textarea></div>
 <div class="card"><h3>Checks</h3><ul id="er" aria-live="polite"></ul><button class="pri" id="sv">Save story</button> <button id="cn">Cancel</button></div>`);
 const ta=$('tx');let tm=0;
 const collect=()=>({id:E.id,title:$('ti').value,text:ta.value,areas:['a','b','c'].map(l=>({area:l,rank:$('rk'+l).value,kind:$('kd'+l).value,memory:$('me'+l).value,line:$('li'+l).value,wh:$('wh'+l).value,wr:$('wr'+l).value,wl:$('wl'+l).value})),decoys:{x1:$('d1').value,x2:$('d2').value},whole:{present:$('wp').value,hook:$('wk').value,flashback:$('wf').value,back:$('wb').value}});
 const prev=()=>{const t=ta.value;$('pv').innerHTML=esc(t).replace(/\[(\w+)\|([^\]]+)\]/g,(m,id,x)=>`<mark><b>${NM[id]||esc(id)}:</b> ${x}</mark>`).replace(/\n/g,'<br>');['a','b','c'].forEach(l=>{const h=t.match(new RegExp('\\[h'+l+'\\|([^\\]]+)\\]')),k=t.match(new RegExp('\\[l'+l+'\\|([^\\]]+)\\]'));$('ph'+l).innerHTML=`Hook: <b>${h?esc(h[1]):'not marked'}</b><br>Link: <b>${k?esc(k[1]):'not marked'}</b>`})};
 const chk=async()=>{prev();try{const r=await api('hl-story-check',{story:collect()});$('er').innerHTML=r.errors.length?r.errors.map(x=>`<li class="err">${esc(x)}</li>`).join(''):'<li class="ok">Everything is ready to save.</li>'}catch(e){}};
 const later=()=>{clearTimeout(tm);tm=setTimeout(chk,500)};
 M.querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('input',later));
 M.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const id=b.dataset.mk,a=ta.selectionStart,z=ta.selectionEnd,v=ta.value,re=new RegExp('\\['+id+'\\|([^\\]]+)\\]');let t;
  if(a===z){t=v.replace(re,'$1')}else{const s=v.slice(a,z);if(/[\[\]|]/.test(s)){alert('Select plain words only, not text that is already marked.');return}t=(v.slice(0,a)+'\u0001'+s+'\u0002'+v.slice(z)).replace(re,'$1').replace('\u0001','['+id+'|').replace('\u0002',']')}
  ta.value=t;ta.focus();later();prev()});
 $('cn').onclick=()=>{E=null;draw()};
 $('sv').onclick=async()=>{try{await api('hl-story-save',{story:collect()});E=null;msg='Story saved.';await start()}catch(e){if(e.message==='login')return;$('er').innerHTML=(e.errors||[e.message]).map(x=>`<li class="err">${esc(x)}</li>`).join('')}};
 chk()}
/* ---------- planning (v0.6) ---------- */
function rPlan(){const sel=(cur,blank)=>`<option value="" ${cur===''?'selected':''}>${blank}</option>${Object.entries(PD.shapes).map(([k,v])=>`<option value="${k}" ${cur===k?'selected':''}>${v.icon} ${esc(v.name)}</option>`).join('')}`,nm=k=>k&&PD.shapes[k]?PD.shapes[k].name:'Story mountain (built-in)';
 shell(`<div class="card"><h2>Which shape do pupils see first?</h2><p>Pupils can choose between the story mountain and the 8-point story arc themselves, at any time. These settings only decide what they see before they choose. A pupil's own choice always wins.</p><p class="mut">Order used: the pupil's own choice, then the class setting, then the school setting, then the story mountain.</p>
 <table><tr><th>Class</th><th>Starting shape</th></tr><tr><td><b>School</b> (all classes)</td><td>${PD.canSchool?`<label for="ps" class="sr">School starting shape</label><select id="ps">${sel(PD.school,'Story mountain (built-in)')}</select>`:esc(nm(PD.school))}</td></tr>${PD.classes.map((c,i)=>`<tr><td>${esc(c.class)}</td><td><label for="pc${i}" class="sr">Starting shape for ${esc(c.class)}</label><select id="pc${i}" data-c="${esc(c.class)}">${sel(c.shape,'Use the school setting')}</select></td></tr>`).join('')||'<tr><td colspan="2">No classes yet. A class appears here once pupils register with it.</td></tr>'}</table></div>
 <div class="card"><h2>The two shapes</h2>${Object.values(PD.shapes).map(S=>`<details><summary><b>${S.icon} ${esc(S.name)}</b> (${S.parts.length} parts)</summary><ol>${S.parts.map(x=>`<li><b>${esc(x.n)}.</b> ${esc(x.t)}</li>`).join('')}</ol><p class="mut">${esc(S.fit)}</p></details>`).join('')}<p class="mut">After each story, pupils see roughly where their hooks or links sit on their shape. This is worked out from where the marked phrase falls in the text, so treat it as a guide.</p></div>`);
 const set=(c,v)=>done(()=>api('plan-default',{class:c,shape:v}),'Saved.');
 M.querySelectorAll('[data-c]').forEach(x=>x.onchange=()=>set(x.dataset.c,x.value));const ps=$('ps');if(ps)ps.onchange=()=>set('*',ps.value)}
/* ---------- teachers (admin) ---------- */
function rTea(){shell(`<div class="card"><h2>Teacher accounts</h2><table><tr><th>Username</th><th>Classes</th><th></th></tr>${TL.map(t=>`<tr><td>${esc(t.username)}</td><td>${t.classes.map(esc).join(', ')||'<span class="mut">none yet</span>'}</td><td class="n"><button class="sm" data-cls="${esc(t.username)}">Set classes</button> <button class="sm" data-rp="${esc(t.username)}">Reset password</button> <button class="sm dg" data-dt="${esc(t.username)}">Delete</button></td></tr>`).join('')||'<tr><td>No teachers yet.</td></tr>'}</table><p class="mut">Teachers only see the classes you assign. Known pupil classes: ${classes().map(esc).join(', ')||'none yet'}.</p></div><div class="card"><h3>Add a teacher</h3><label for="nu">Username</label><input id="nu" autocomplete="off"><label for="np">Password (8+ characters)</label><input id="np" type="password" autocomplete="new-password"><br><button class="pri" id="ad">Create teacher</button></div>`);
 $('ad').onclick=()=>done(()=>api('teacher-create',{username:$('nu').value,password:$('np').value}),'Teacher created. Now set their classes.');
 M.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{const u=b.dataset.cls,c=prompt('Classes for '+u+', separated by commas (e.g. 4A, 4B)',(TL.find(t=>t.username===u).classes||[]).join(', '));if(c!==null)done(()=>api('teacher-classes',{username:u,classes:c.split(',')}),'Classes updated')});
 M.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{const u=b.dataset.rp,p=prompt('New password for '+u+' (8+ characters)');if(p)done(()=>api('teacher-reset',{username:u,password:p}),'Password reset')});
 M.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{const u=b.dataset.dt;if(confirm('Delete teacher '+u+'? Their pupils and results are not affected.'))done(()=>api('teacher-delete',{username:u}),'Teacher deleted')})}
function rPw(){if(ROLE==='admin')return shell('<div class="card"><p>The super admin password is a Cloudflare secret (<code>admin_user</code> / <code>admin_password</code>). Change it in the Cloudflare dashboard.</p></div>');
 shell(`<div class="card"><h2>Change password</h2><label for="op">Current password</label><input id="op" type="password" autocomplete="current-password"><label for="pw">New password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password"><br><button class="pri" id="cp">Change password</button></div>`);
 $('cp').onclick=()=>done(()=>api('change-password',{old:$('op').value,password:$('pw').value}),'Password changed')}
T?start():login();
</script></body></html>
